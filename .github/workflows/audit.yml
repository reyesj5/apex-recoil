name: Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Every Monday too: an advisory can be published while nothing here changes
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Known vulnerabilities in the two locks, pnpm-lock.yaml and processing/requirements.txt. On Ubuntu
# only: a lock's advisories are the same on every system. Actions are pinned to their release's commit.

jobs:
  locks:
    name: Known vulnerabilities in the locks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Version comes from devEngines.packageManager in package.json (pnpm 12 needs v6.1+)
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.x

    - name: pnpm-lock.yaml
      run: pnpm audit

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    # Every package is pinned in the lock with its hashes, so pip-audit reads it as it is, resolving nothing
    - name: processing/requirements.txt
      run: |
        python -m pip install pip-audit==2.10.1
        pip-audit -r processing/requirements.txt --require-hashes --disable-pip --progress-spinner off
