name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  web:
    name: Web (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Vite 8 requires Node 20.19+ or 22.12+
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    # Version comes from devEngines.packageManager in package.json (pnpm 12 needs v6.1+)
    - uses: pnpm/action-setup@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: pnpm

    # The job queue tests spawn Python processes
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install
      run: pnpm install --frozen-lockfile

    - name: Typecheck
      run: pnpm exec tsc --noEmit

    - name: Build
      run: pnpm build

    - name: Test
      run: pnpm test

    - name: Static site build
      run: pnpm static

  integration:
    name: Integration (Redis/BullMQ + S3)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: pnpm

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: processing/requirements.txt

    # opencv-python needs the system OpenGL runtime
    - name: System libraries
      run: sudo apt-get update && sudo apt-get install -y libgl1

    - name: Install
      run: |
        pnpm install --frozen-lockfile
        pip install -r processing/requirements.txt

    - name: Start Redis and S3 (compose.yaml)
      run: |
        docker compose up -d --wait redis
        docker compose up -d s3
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true)
          if [ "$code" = "403" ] || [ "$code" = "200" ]; then exit 0; fi
          sleep 1
        done
        docker compose logs s3
        exit 1

    - name: Build
      run: pnpm build

    - name: All Node tests, including Redis, S3 and end-to-end analysis
      run: pnpm test:services

  processing:
    name: Processing (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: processing/requirements.txt

    # opencv-python needs the system OpenGL runtime
    - name: System libraries
      run: sudo apt-get update && sudo apt-get install -y libgl1

    - name: Install
      run: pip install -r requirements.txt

    - name: Unit tests
      run: python -m pytest tests

    - name: Spec schema verification
      run: python -m recoil_discovery.cli verify

    - name: Shadow parity (SQLite vs client/specs.json)
      run: python -m recoil_discovery.shadow_parity
