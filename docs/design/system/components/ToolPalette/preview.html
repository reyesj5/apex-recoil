<!-- @dsCard group="Navigation" height=520 subtitle="Studio tools and zoom over the canvas and the wall frame" -->
<div class="sd-preview" style="padding: 0;">
  <div class="sd-canvas" style="min-height: 500px;">
    <figure class="sd-wall" style="margin: 0; width: 280px; height: 440px;">
      <figcaption class="sd-wall__caption">[Wall screenshot]</figcaption>
      <svg role="img" aria-label="R-99 recoil pattern with 33 shots over the wall image" viewBox="120 90 90 280" style="height: 400px; width: auto;">
        <defs>
          <marker id="spec-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.4" markerHeight="2.4"><circle class="sd-spec__dot" cx="5" cy="5" r="4"></circle></marker>
        </defs>
        <polyline class="sd-spec__line" points="160,350 163,337 164,325 161,314 160,296 165,273 171,253 177,239 181,221 182,208 177,192 171,177 170,164 168,148 170,143 175,141 181,135 188,136 181,126 173,125 164,122 160,119 155,117 160,114 167,116 175,116 179,114 174,110 167,107 172,100 170,100 169,100 169,100" marker-mid="url(#spec-dot)" marker-end="url(#spec-dot)"></polyline>
        <circle class="sd-spec__start" cx="160" cy="350" r="3"></circle>
        <circle class="sd-spec__selected" cx="181" cy="221" r="4.5"></circle>
      </svg>
      <div role="status" class="sd-wall__status">Shot <strong>9</strong> of 33 · drag to move</div>
    </figure>
    <div role="toolbar" aria-label="Canvas tools" aria-orientation="vertical" class="sd-tools" style="position: absolute; top: 16px; left: 16px;">
      <button type="button" class="sd-tool" aria-pressed="true" aria-label="Select and move shots (V)"><svg class="sd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 2-2 6z"></path></svg></button>
      <button type="button" class="sd-tool" aria-pressed="false" aria-label="Pan (H or hold Space)"><svg class="sd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 16 0v-3a2 2 0 0 0-4 0"></path></svg></button>
      <button type="button" class="sd-tool" aria-pressed="false" aria-label="Align whole spray (A)"><svg class="sd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20M9 5l3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3"></path></svg></button>
      <button type="button" class="sd-tool" aria-pressed="false" aria-label="Correct shots: add or remove holes (C)"><svg class="sd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 8v8M8 12h8"></path></svg></button>
      <button type="button" class="sd-tool" aria-pressed="false" aria-label="Fit and center (F)"><svg class="sd-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path></svg></button>
    </div>
    <div class="sd-zoom" style="position: absolute; right: 16px; bottom: 16px;">
      <button type="button" class="sd-zoom__button" aria-label="Zoom out">−</button>
      <span class="sd-zoom__value">100%</span>
      <button type="button" class="sd-zoom__button" aria-label="Zoom in">+</button>
      <button type="button" class="sd-zoom__fit">Fit</button>
    </div>
  </div>
</div>
<script>
var tools = document.querySelector('.sd-tools');
tools.addEventListener('click', function (event) {
  var tool = event.target.closest('button');
  if (!tool) return;
  tools.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === tool)); });
});
var level = 100;
var value = document.querySelector('.sd-zoom__value');
document.querySelector('[aria-label="Zoom out"]').addEventListener('click', function () { level = Math.max(25, level - 25); value.textContent = level + '%'; });
document.querySelector('[aria-label="Zoom in"]').addEventListener('click', function () { level = Math.min(400, level + 25); value.textContent = level + '%'; });
document.querySelector('.sd-zoom__fit').addEventListener('click', function () { level = 100; value.textContent = '100%'; });
</script>
