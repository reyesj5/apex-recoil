<!-- @dsCard group="Actions" height=250 subtitle="Primary, secondary, ghost, destructive and icon; 38, 36, 34, 40 and 44 px" -->
<div class="sd-preview">
  <div class="sd-row">
    <button type="button" class="sd-btn sd-btn--primary">Save spec</button>
    <button type="button" class="sd-btn sd-btn--secondary">Open progress</button>
    <button type="button" class="sd-btn sd-btn--ghost">Cancel</button>
    <button type="button" class="sd-btn sd-btn--danger">Delete sample</button>
    <button type="button" class="sd-btn sd-btn--icon" aria-label="Help"><svg class="sd-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></button>
    <button type="button" class="sd-btn sd-btn--icon sd-btn--compact" aria-label="Mute sounds"><svg class="sd-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg></button>
  </div>
  <div class="sd-row">
    <button type="button" class="sd-btn sd-btn--primary sd-btn--sm">Save spec <kbd class="sd-kbd sd-kbd--inset">Ctrl S</kbd></button>
    <button type="button" class="sd-btn sd-btn--icon sd-btn--sm" aria-label="Undo"><svg class="sd-icon sd-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></button>
    <button type="button" class="sd-btn sd-btn--icon sd-btn--sm" aria-label="Redo" disabled><svg class="sd-icon sd-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg></button>
    <button type="button" class="sd-btn sd-btn--secondary sd-btn--sm">Compare spec with candidate</button>
  </div>
  <div class="sd-row">
    <a href="#progress" class="sd-btn sd-btn--secondary sd-btn--lg"><svg class="sd-icon sd-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>Open progress</a>
    <button type="button" class="sd-btn sd-btn--primary sd-btn--touch sd-btn--pill"><svg class="sd-icon sd-icon--14" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor; stroke: none;"><path d="M7 4v16l13-8z"></path></svg>Play spray</button>
    <button type="button" class="sd-btn sd-btn--secondary sd-btn--touch">Copy link</button>
  </div>
</div>
