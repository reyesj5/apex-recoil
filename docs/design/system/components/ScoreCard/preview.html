<!-- @dsCard group="Data" height=330 subtitle="Session card before the first run, and run results above and below today's median" -->
<div class="sd-preview">
  <div class="sd-row" style="align-items: flex-start; gap: 20px;">
    <div class="sd-score" style="width: 260px;">
      <div class="sd-score__label">Last score</div>
      <p class="sd-score__empty">Your first run today shows up here.</p>
    </div>
    <div role="status" aria-label="Run result" class="sd-result">
      <div class="sd-section-label">Run complete</div>
      <div class="sd-result__line"><span class="sd-result__value">87</span><span class="sd-result__max">/ 100</span></div>
      <div class="sd-result__delta">
        <span class="sd-delta"><svg class="sd-icon sd-icon--12" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.5;"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg>9</span>
        above today’s median
      </div>
      <div class="sd-result__meta">R-301 · Lv 2 magazine (28) · Follow path</div>
      <div class="sd-result__actions">
        <button type="button" class="sd-btn sd-btn--secondary">Replay</button>
        <button type="button" class="sd-btn sd-btn--primary">Next run</button>
      </div>
    </div>
    <div role="status" aria-label="Run result below today's median" class="sd-result sd-result--below">
      <div class="sd-section-label">Run complete</div>
      <div class="sd-result__line"><span class="sd-result__value">71</span><span class="sd-result__max">/ 100</span></div>
      <div class="sd-result__delta">
        <span class="sd-delta sd-delta--down"><svg class="sd-icon sd-icon--12" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.5;"><path d="m19 12-7 7-7-7"></path><path d="M12 5v14"></path></svg>7</span>
        below today’s median
      </div>
      <div class="sd-result__meta">R-301 · Lv 2 magazine (28) · Follow path</div>
      <div class="sd-result__actions">
        <button type="button" class="sd-btn sd-btn--secondary">Replay</button>
        <button type="button" class="sd-btn sd-btn--primary">Next run</button>
      </div>
    </div>
  </div>
</div>
