<div class="sd-preview" style="padding: 0; flex-direction: row;">

    <a href="#library" class="sd-rail__item" aria-label="Screenshot library"><svg class="sd-icon sd-icon--20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6"></path></svg><span>Library</span></a>
    <a href="#sessions" class="sd-rail__item" aria-label="Saved sessions"><svg class="sd-icon sd-icon--20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8L10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"></path></svg><span>Sessions</span></a>
    <a href="#import" class="sd-rail__item" aria-label="Import discovery JSON"><svg class="sd-icon sd-icon--20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg><span>Import</span></a>
  </nav>
</div>
<script>
var rail = document.querySelector('.sd-rail');
rail.addEventListener('click', function (event) {
  var item = event.target.closest('a');
  if (!item) return;
  event.preventDefault();
  rail.querySelectorAll('a').forEach(function (a) { if (a === item) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
});
</script>
