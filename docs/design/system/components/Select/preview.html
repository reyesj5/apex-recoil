<!-- @dsCard group="Fields" height=250 subtitle="Field, Studio, top bar and toolbar selects" -->
<div class="sd-preview">
  <div class="sd-panel" style="max-width: 340px;">
    <label class="sd-field">Optic
      <select class="sd-select"><option>2× HCOG Bruiser</option><option>1× HCOG Classic</option></select>
    </label>
    <label class="sd-field" style="font-size: 12px;">Color correction
      <select class="sd-select sd-select--sm"><option>HDR fix (natural)</option><option>None</option></select>
    </label>
  </div>
  <div class="sd-row">
    <label for="lang" class="sd-visually-hidden">Language</label>
    <select id="lang" class="sd-select sd-select--quiet"><option>English</option><option>Русский</option><option>中文</option></select>
    <label class="sd-toolbar-field">Replay
      <select class="sd-select sd-select--bare"><option>0.5×</option><option selected>1×</option><option>2×</option></select>
    </label>
    <label class="sd-toolbar-field" style="font-size: 13px;">Weapon
      <select class="sd-select sd-select--bare"><option>All weapons</option><option>R-301</option><option>R-99</option></select>
    </label>
  </div>
</div>
