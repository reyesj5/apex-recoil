<!-- @dsCard group="Surfaces" height=1000 subtitle="Ready to practice, and after a run (R-301)" -->
<div class="sd-preview">
  <section aria-label="Practice range" class="sd-range" style="min-height: 470px;">
    <div role="toolbar" aria-label="Practice options" class="sd-range__toolbar">
      <div role="radiogroup" aria-label="Mode" class="sd-segmented sd-segmented--floating">
        <button type="button" class="sd-segmented__item" role="radio" aria-checked="true">Follow path</button>
        <button type="button" class="sd-segmented__item" role="radio" aria-checked="false">Still target</button>
        <button type="button" class="sd-segmented__item" role="radio" aria-checked="false">Moving target</button>
      </div>
      <div role="radiogroup" aria-label="Show results as" class="sd-segmented sd-segmented--floating">
        <button type="button" class="sd-segmented__item" role="radio" aria-checked="false">Target</button>
        <button type="button" class="sd-segmented__item" role="radio" aria-checked="true">Dots</button>
        <button type="button" class="sd-segmented__item" role="radio" aria-checked="false">Lines</button>
      </div>
      <label class="sd-toolbar-field">Replay
        <select class="sd-select sd-select--bare"><option>0.5×</option><option selected>1×</option><option>2×</option></select>
      </label>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 72px 16px 64px;">
      <svg role="img" aria-label="R-301: the path to follow" viewBox="100 6 80 150" style="width: 160px; height: 247px; max-width: 100%;">
        <defs>
          <marker id="ready-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2"><circle class="sd-pattern__ghost-dot" cx="5" cy="5" r="4"></circle></marker>
        </defs>
        <polyline class="sd-pattern__ghost" points="160,26 155,37 155,53 149,63 150,75 148,85 149,91 147,96 144,98 140,102 134,101 132,105 136,112 141,118 147,123 153,124 158,124 162,124 163,129 161,133 156,137 151,138 147,141 141,140 138,139 134,139 131,141 131,144" marker-mid="url(#ready-dot)" marker-end="url(#ready-dot)"></polyline>
        <circle class="sd-pattern__start" cx="160" cy="26" r="9"></circle>
        <line class="sd-pattern__start" x1="160" x2="160" y1="40" y2="33"></line>
        <line class="sd-pattern__start" x1="160" x2="160" y1="19" y2="12"></line>
        <line class="sd-pattern__start" x1="174" x2="167" y1="26" y2="26"></line>
        <line class="sd-pattern__start" x1="153" x2="146" y1="26" y2="26"></line>
      </svg>
      <p class="sd-range__instruction"><strong>Click and hold anywhere in the range to spray</strong><span>Follow the path with your aim as the gun climbs, and your shots stay on the start point.</span></p>
    </div>
    <button type="button" class="sd-settings-chip sd-range__bottom-left"><svg class="sd-icon sd-icon--16" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="6"></rect><path d="M12 7v4"></path></svg><span>Sensitivity <strong class="sd-mono">5.0</strong></span><span>ADS <strong class="sd-mono">1.0×</strong></span><span>Invert Y <strong>off</strong></span></button>
    <button type="button" class="sd-btn sd-btn--icon sd-range__bottom-right" aria-label="Mute sounds"><svg class="sd-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg></button>
  </section>
  <section aria-label="Practice range after a run" class="sd-range" style="min-height: 440px;">
    <svg role="img" aria-label="Your R-301 run over the path to follow" viewBox="100 11 80 145" style="width: 190px; height: 340px; max-width: 100%;">
      <defs>
        <marker id="ghost-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3"><circle class="sd-pattern__ghost-dot sd-pattern__ghost-dot--faint" cx="5" cy="5" r="4"></circle></marker>
        <marker id="shot-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.4" markerHeight="3.4"><circle class="sd-pattern__shot-dot" cx="5" cy="5" r="4"></circle></marker>
      </defs>
      <polyline class="sd-pattern__ghost sd-pattern__ghost--faint" points="160,26 155,37 155,53 149,63 150,75 148,85 149,91 147,96 144,98 140,102 134,101 132,105 136,112 141,118 147,123 153,124 158,124 162,124 163,129 161,133 156,137 151,138 147,141 141,140 138,139 134,139 131,141 131,144" marker-mid="url(#ghost-dot)" marker-end="url(#ghost-dot)"></polyline>
      <polyline class="sd-pattern__shots" points="160,23 153,34 152,50 145,61 145,73 143,84 144,91 143,96 141,99 138,104 134,103 133,108 139,115 145,121 152,126 154,127 159,126 162,126 162,130 159,133 152,137 146,137 140,139 133,138 129,136 125,136 122,138 123,141" marker-mid="url(#shot-dot)" marker-end="url(#shot-dot)"></polyline>
      <circle class="sd-pattern__start" cx="160" cy="26" r="9"></circle>
    </svg>
    <div class="sd-legend-chip sd-range__bottom-left">
      <span class="sd-legend__item"><span class="sd-legend-chip__pattern"></span>Pattern</span>
      <span class="sd-legend__item"><span class="sd-legend-chip__shot"></span>Your shots</span>
    </div>
  </section>
</div>
<script>
document.querySelectorAll('[role="radiogroup"]').forEach(function (group) {
  group.addEventListener('click', function (event) {
    var item = event.target.closest('button');
    if (!item || !group.contains(item)) return;
    group.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-checked', String(b === item)); });
  });
});
</script>
