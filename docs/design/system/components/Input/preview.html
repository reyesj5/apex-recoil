<!-- @dsCard group="Fields" height=280 subtitle="Search, with a unit, and the dense Studio size" -->
<div class="sd-preview">
  <div class="sd-panel" style="max-width: 340px;">
    <label class="sd-field">Weapon filter
      <input type="search" class="sd-input" placeholder="Filter weapons">
    </label>
    <div class="sd-fields-2">
      <label class="sd-field">Distance
        <span class="sd-input-unit"><input type="number" value="20"><span class="sd-input-unit__unit">m</span></span>
      </label>
      <label class="sd-field">Field of view
        <span class="sd-input-unit"><input type="number" value="104"><span class="sd-input-unit__unit">°</span></span>
      </label>
    </div>
  </div>
  <div class="sd-card" style="max-width: 308px; font-size: 13px;">
    <div class="sd-fields-2">
      <label class="sd-field">Fire rate
        <span class="sd-input-unit sd-input-unit--sm"><input type="number" value="1080"><span class="sd-input-unit__unit">RPM</span></span>
      </label>
      <label class="sd-field">Multiplier
        <input type="number" class="sd-input sd-input--sm sd-input--number" value="0.73" step="0.01">
      </label>
    </div>
  </div>
</div>
