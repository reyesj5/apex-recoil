<!-- @dsCard group="Overlays" height=270 subtitle="Before a sample is deleted" -->
<div class="sd-preview">
  <div class="sd-scrim">
    <section role="alertdialog" aria-labelledby="delete-title" aria-describedby="delete-text" class="sd-dialog">
      <div class="sd-dialog__head">
        <h2 id="delete-title" class="sd-dialog__title">Delete this sample?</h2>
        <p id="delete-text" class="sd-dialog__description">Spray 3 and its wall screenshot are removed from the session.</p>
      </div>
      <div class="sd-dialog__footer">
        <button type="button" class="sd-btn sd-btn--secondary">Keep sample</button>
        <button type="button" class="sd-btn sd-btn--danger">Delete sample</button>
      </div>
    </section>
  </div>
</div>
